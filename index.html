<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сведения о нарушениях кассиров</title>
<style>
:root{--red:#e2001a;--dark:#a80013;--line:rgba(255,255,255,.35);--txt:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:#e3051f url(bg.png) center bottom/cover fixed no-repeat;color:var(--txt);padding:24px 16px 40px;position:relative}
.brand{position:relative;z-index:1;text-align:center;margin:0 auto 18px}
.brand img{width:min(440px,80%);height:auto;display:inline-block}
.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;background:rgba(255,255,255,.10);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.45);border-radius:14px;box-shadow:0 20px 50px rgba(60,0,6,.45);overflow:hidden}
.top{background:rgba(168,0,19,.55);padding:16px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.top small{opacity:.9;display:block;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.6);border-radius:6px;padding:8px 14px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;font-weight:600}
button:hover{background:rgba(255,255,255,.32)}
.formula{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.12);font-size:13px}
.formula b{color:#fff;font-style:italic;font-family:serif}
.formula input{flex:1;border:1px solid var(--line);padding:5px 8px;border-radius:4px;font:inherit;background:rgba(255,255,255,.15);color:#fff}
.formula input::placeholder{color:rgba(255,255,255,.7)}
.wrap{max-height:68vh;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th,td{border:1px solid var(--line);padding:0;height:28px}
thead th{position:sticky;top:0;z-index:2;background:rgba(150,0,16,.88);color:#fff;font-weight:600;padding:6px 8px;text-align:center}
th.rn,td.rn{width:44px;background:rgba(120,0,14,.8);text-align:center;color:#fff;font-weight:600;position:sticky;left:0;z-index:1}
thead th.rn{z-index:3}
td[contenteditable]{text-shadow:0 1px 2px rgba(120,0,12,.55);padding:4px 8px;outline:none;white-space:nowrap;color:#fff}
td[contenteditable]:focus{outline:2px solid #fff;outline-offset:-2px;background:rgba(255,255,255,.28);white-space:normal}
tbody tr:nth-child(even) td:not(.rn){background:rgba(255,255,255,.07)}
tbody tr:hover td:not(.rn){background:rgba(255,255,255,.2)}
.tabs{display:flex;align-items:flex-end;gap:2px;background:rgba(120,0,14,.6);border-top:1px solid var(--line);padding:6px 12px 0}
.tab{border-radius:0 0 8px 8px;border:1px solid var(--line);border-top:0;padding:7px 22px;background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.tab.on{background:rgba(255,255,255,.35);font-weight:700;box-shadow:inset 0 -3px 0 #fff}
.tabs .cnt{margin-left:auto;font-size:12px;color:#fff;padding-bottom:8px}
@media(max-width:600px){.top h1{font-size:17px}}
@media print{body{background:#fff}.brand{display:none}.app{background:#fff;color:#000;border:0;box-shadow:none}td[contenteditable],.top h1{color:#000}.top,.tabs,.formula{display:none}.wrap{max-height:none}th,td{border-color:#999}thead th{background:#eee;color:#000}th.rn,td.rn{background:#eee;color:#000}}
</style>
</head>
<body>
<div class="brand"><img src="logo.png" alt="korzinka"></div>
<div class="app">
  <div class="top">
    <div><h1>Сведения о нарушениях кассиров</h1><small>Korzinka · журнал нарушений</small></div>
    <div class="actions">
      <button id="add">+ Qator qo‘shish</button>
      <button id="csv">⬇ CSV (Excel)</button>
      <button id="print">🖨 Chop etish</button>
      <button id="clear">Tozalash</button>
    </div>
  </div>
  <div class="formula"><b>fx</b><input id="fx" placeholder="Katakni tanlang va yozing…"></div>
  <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="tabs" id="tabs"></div>
</div>
<script>
const COLS=["Ф.И.О кассира","Должность","Дата","№ кассы","Время","Сумма","Характер нарушения"];
const SECTIONS=["Куйлюк","Бектемир"], ROWS=40, KEY="kassir-violations-v1";
let data; try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data) data=Object.fromEntries(SECTIONS.map(s=>[s,Array.from({length:ROWS},()=>Array(COLS.length).fill(""))]));
let cur=SECTIONS[0], active=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);

function render(){
  $("thead").innerHTML="<tr><th class='rn'>№</th>"+COLS.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  $("tbody").innerHTML=data[cur].map((r,i)=>`<tr><td class='rn'>${i+1}</td>`+r.map((v,j)=>`<td contenteditable data-r='${i}' data-c='${j}'></td>`).join("")+"</tr>").join("");
  document.querySelectorAll("td[contenteditable]").forEach(td=>td.textContent=data[cur][td.dataset.r][td.dataset.c]);
  $("tabs").innerHTML=SECTIONS.map(s=>`<div class="tab ${s==cur?'on':''}" data-s="${s}" style="cursor:pointer">${s}</div>`).join("")+`<span class="cnt">${data[cur].length} qator</span>`;
}
$("tabs").onclick=e=>{const s=e.target.dataset.s;if(s){cur=s;render()}};
$("tbody").addEventListener("input",e=>{const t=e.target;data[cur][t.dataset.r][t.dataset.c]=t.textContent;$("fx").value=t.textContent;save()});
$("tbody").addEventListener("focusin",e=>{active=e.target;$("fx").value=e.target.textContent});
$("fx").addEventListener("input",()=>{if(active&&active.dataset.r!==undefined){active.textContent=$("fx").value;data[cur][active.dataset.r][active.dataset.c]=$("fx").value;save()}});
$("tbody").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();const t=e.target,r=+t.dataset.r+1;const n=document.querySelector(`td[data-r='${r}'][data-c='${t.dataset.c}']`);n&&n.focus()}
});
$("tbody").addEventListener("paste",e=>{
  const t=e.target;if(t.dataset.r===undefined)return;
  const txt=(e.clipboardData||window.clipboardData).getData("text");
  if(!/[\t\n]/.test(txt.trim()))return;
  e.preventDefault();
  txt.trim().split(/\r?\n/).forEach((line,i)=>line.split("\t").forEach((v,j)=>{
    const r=+t.dataset.r+i,c=+t.dataset.c+j;
    if(c<COLS.length){if(!data[cur][r])data[cur][r]=Array(COLS.length).fill("");data[cur][r][c]=v}
  }));
  save();render();
});
$("add").onclick=()=>{data[cur].push(Array(COLS.length).fill(""));save();render();$("tbody").lastElementChild.scrollIntoView()};
$("clear").onclick=()=>{if(confirm(cur+" bo‘limi tozalansinmi?")){data[cur]=Array.from({length:ROWS},()=>Array(COLS.length).fill(""));save();render()}};
$("print").onclick=()=>print();
$("csv").onclick=()=>{
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[["№",...COLS],...data[cur].map((r,i)=>[i+1,...r])];
  const blob=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=cur+".csv";a.click();
};
render();
</script>
</body>
</html>
